name: Deploy

on:
    push:
        branches: [ "master" ]

permissions:
    deployments: write

concurrency:
    group: deploy-production
    cancel-in-progress: false

# The actual deploy is triggered by a GitHub webhook configured on this repo,
# pointed at Coolify's manual webhook endpoint (routes/webhooks.php has no
# IP-allowlist middleware, unlike Coolify's /api/* routes -- so this repo's
# webhook works from GitHub's servers even though Coolify's API itself is
# IP-restricted and would reject calls from Actions runners). This workflow
# only tracks that deploy as a GitHub Deployment; it doesn't trigger it.
jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            - name: Create deployment
              id: deployment
              uses: actions/github-script@v7
              with:
                  script: |
                      const { data } = await github.rest.repos.createDeployment({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          ref: context.sha,
                          environment: 'production',
                          auto_merge: false,
                          required_contexts: [],
                          production_environment: true,
                      });
                      core.setOutput('id', data.id);

            - name: Mark deployment in progress
              uses: actions/github-script@v7
              with:
                  script: |
                      await github.rest.repos.createDeploymentStatus({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          deployment_id: ${{ steps.deployment.outputs.id }},
                          state: 'in_progress',
                          environment_url: 'https://dispuutivv.nl',
                      });

            - name: Wait for the site to come back up
              id: wait
              run: |
                  url="http://j11arvfxsvxqohvfd3ed6z7a.178.104.113.205.sslip.io"
                  final_status="timeout"
                  for i in $(seq 1 30); do
                      sleep 10
                      code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 10 "$url" || echo "000")
                      echo "attempt $i: HTTP $code"
                      if [ "$code" = "200" ]; then
                          final_status="success"
                          break
                      fi
                  done
                  echo "final_status=$final_status" >> "$GITHUB_OUTPUT"

            - name: Update deployment status
              uses: actions/github-script@v7
              with:
                  script: |
                      const finalStatus = '${{ steps.wait.outputs.final_status }}';
                      await github.rest.repos.createDeploymentStatus({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          deployment_id: ${{ steps.deployment.outputs.id }},
                          state: finalStatus === 'success' ? 'success' : 'failure',
                          environment_url: 'https://dispuutivv.nl',
                      });
                      if (finalStatus !== 'success') {
                          core.setFailed(`Site did not come back up after deploy (status: ${finalStatus})`);
                      }
