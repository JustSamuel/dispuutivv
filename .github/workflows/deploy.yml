name: Deploy

on:
    push:
        branches: [ "master" ]

permissions:
    deployments: write

concurrency:
    group: deploy-production
    cancel-in-progress: false

jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            - name: Create deployment
              id: deployment
              uses: actions/github-script@v7
              with:
                  script: |
                      const { data } = await github.rest.repos.createDeployment({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          ref: context.sha,
                          environment: 'production',
                          auto_merge: false,
                          required_contexts: [],
                          production_environment: true,
                      });
                      core.setOutput('id', data.id);

            - name: Mark deployment in progress
              uses: actions/github-script@v7
              with:
                  script: |
                      await github.rest.repos.createDeploymentStatus({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          deployment_id: ${{ steps.deployment.outputs.id }},
                          state: 'in_progress',
                          environment_url: 'https://dispuutivv.nl',
                      });

            - name: Trigger Coolify deploy
              id: trigger
              env:
                  COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
              run: |
                  response=$(curl -sS -X POST "https://dev.oosterho.lt/api/v1/deploy" \
                      -H "Authorization: Bearer $COOLIFY_TOKEN" \
                      -H "Content-Type: application/json" \
                      -d '{"uuid": "j11arvfxsvxqohvfd3ed6z7a"}')
                  echo "$response"
                  deployment_uuid=$(echo "$response" | python3 -c "import json,sys; print(json.load(sys.stdin)['deployments'][0]['deployment_uuid'])")
                  echo "deployment_uuid=$deployment_uuid" >> "$GITHUB_OUTPUT"

            - name: Wait for Coolify build to finish
              id: wait
              env:
                  COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
              run: |
                  final_status="timeout"
                  for i in $(seq 1 90); do
                      status=$(curl -sS "https://dev.oosterho.lt/api/v1/deployments/${{ steps.trigger.outputs.deployment_uuid }}" \
                          -H "Authorization: Bearer $COOLIFY_TOKEN" | python3 -c "import json,sys; print(json.load(sys.stdin).get('status',''))")
                      echo "status: $status"
                      if [ "$status" = "finished" ] || [ "$status" = "failed" ]; then
                          final_status="$status"
                          break
                      fi
                      sleep 10
                  done
                  echo "final_status=$final_status" >> "$GITHUB_OUTPUT"

            - name: Update deployment status
              uses: actions/github-script@v7
              with:
                  script: |
                      const finalStatus = '${{ steps.wait.outputs.final_status }}';
                      await github.rest.repos.createDeploymentStatus({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          deployment_id: ${{ steps.deployment.outputs.id }},
                          state: finalStatus === 'finished' ? 'success' : 'failure',
                          environment_url: 'https://dispuutivv.nl',
                      });
                      if (finalStatus !== 'finished') {
                          core.setFailed(`Coolify deployment ended with status: ${finalStatus}`);
                      }
