name: Build and Deploy

on:
    push:
        branches: [ "master" ]

permissions:
    contents: read
    packages: write
    deployments: write

concurrency:
    group: deploy-production
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest
        container:
            image: docker:dind
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7
              with:
                  persist-credentials: false

            - name: Set up QEMU
              uses: docker/setup-qemu-action@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Log in to GitHub Container Registry
              uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.repository_owner }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Set Docker Tags
              run: |
                  OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
                  IMAGE="ghcr.io/${OWNER}/dispuutivv"
                  echo "TAGS=${IMAGE}:latest" >> $GITHUB_ENV

            - name: Build and Push Docker Image
              uses: docker/build-push-action@v7
              with:
                  context: .
                  platforms: linux/amd64
                  push: true
                  tags: ${{ env.TAGS }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
                  file: ./Dockerfile

    # Coolify's API is IP-restricted and unreachable from Actions runners, so this
    # doesn't call it directly. Instead it signs a GitHub-webhook-shaped payload with
    # the app's own manual_webhook_secret_github and posts it to Coolify's webhook
    # route (routes/webhooks.php has no IP-allowlist middleware, unlike /api/*), which
    # tells Coolify's dockerimage-sourced app to pull the tag the build job just pushed.
    # This only runs after the image is actually pushed, so it never redeploys stale.
    deploy:
        needs: build
        runs-on: ubuntu-latest
        steps:
            - name: Create deployment
              id: deployment
              uses: actions/github-script@v7
              with:
                  script: |
                      const { data } = await github.rest.repos.createDeployment({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          ref: context.sha,
                          environment: 'production',
                          auto_merge: false,
                          required_contexts: [],
                          production_environment: true,
                      });
                      core.setOutput('id', data.id);

            - name: Mark deployment in progress
              uses: actions/github-script@v7
              with:
                  script: |
                      await github.rest.repos.createDeploymentStatus({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          deployment_id: ${{ steps.deployment.outputs.id }},
                          state: 'in_progress',
                          environment_url: 'https://dispuutivv.nl',
                      });

            - name: Trigger Coolify deploy via signed webhook
              env:
                  COOLIFY_WEBHOOK_SECRET: ${{ secrets.COOLIFY_WEBHOOK_SECRET }}
              run: |
                  cat > payload.json <<EOF
                  {"ref":"refs/heads/master","after":"${{ github.sha }}","repository":{"full_name":"JustSamuel/dispuutivv"},"commits":[]}
                  EOF
                  signature=$(openssl dgst -sha256 -hmac "$COOLIFY_WEBHOOK_SECRET" payload.json | sed 's/^.* //')
                  curl -sS -f -X POST "https://dev.oosterho.lt/webhooks/source/github/events/manual" \
                      -H "Content-Type: application/json" \
                      -H "X-GitHub-Event: push" \
                      -H "X-Hub-Signature-256: sha256=$signature" \
                      --data-binary @payload.json

            - name: Wait for the new image to come up
              id: wait
              run: |
                  final_status="timeout"
                  for i in $(seq 1 24); do
                      sleep 5
                      code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 10 "https://dispuutivv.nl/" || echo "000")
                      echo "attempt $i: HTTP $code"
                      if [ "$code" = "200" ]; then
                          final_status="success"
                          break
                      fi
                  done
                  echo "final_status=$final_status" >> "$GITHUB_OUTPUT"

            - name: Update deployment status
              uses: actions/github-script@v7
              with:
                  script: |
                      const finalStatus = '${{ steps.wait.outputs.final_status }}';
                      await github.rest.repos.createDeploymentStatus({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          deployment_id: ${{ steps.deployment.outputs.id }},
                          state: finalStatus === 'success' ? 'success' : 'failure',
                          environment_url: 'https://dispuutivv.nl',
                      });
                      if (finalStatus !== 'success') {
                          core.setFailed(`Site did not come back up after deploy (status: ${finalStatus})`);
                      }
